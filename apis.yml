aid: liquidonate
name: LiquiDonate
description: >-
  LiquiDonate is a San Francisco based reverse-logistics and donation-disposition platform that turns
  retail returns, excess inventory and unsellable goods into local nonprofit donations instead of landfill
  or liquidation. Its matching engine pairs items with nearby nonprofits that want them, buys the shipping
  label, routes the parcel and generates the donation receipt, so retailers recover tax value and meet
  extended-producer-responsibility and sustainability obligations. The company sells three product lines -
  ReturnsDirect (customer-direct returns), WarehouseDirect (warehouse and 3PL excess inventory) and BoxDrop
  (donation boxes) - and exposes two public developer APIs: MagicMatch, a donation-as-a-service API that
  accepts parcel and item details and returns a nonprofit match plus a donation shipping label, and
  ReturnsDirect, a beta returns-management integration for non-Shopify ecommerce platforms built on pushed
  order data plus HMAC-signed return and refund webhooks. LiquiDonate integrates with Shopify, Loop,
  EasyPost, FedEx, Bungii, SendGrid and Rise AI, and has been recognized on TIME Best Inventions 2025 and
  Fast Company World Changing Ideas.
