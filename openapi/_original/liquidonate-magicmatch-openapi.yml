    MatchResponse:
      type: object
      properties:
        match:
          $ref: '#/components/schemas/Match'
    MatchRequest:
      type: object
      properties:
        donor:
          $ref: '#/components/schemas/Donor'
        location:
          $ref: '#/components/schemas/Location'
        parcel:
          type: object
          properties:
            weight:
              type: number
              format: double
              description: Total parcel weight in pounds.
              example: 2.7
        items:
          type: array
          items:
            $ref: '#/components/schemas/RequestItem'
        match_uuid:
          type: string
          format: uuid
          description: Optional. UUID returned by v1/matchAndShip/estimate. Recommended so the same match
            and rate are applied.
        order_id:
          type: string
          description: Optional. Your identifier for the associated order.
        rma_id:
          type: string
          description: Optional. Return Merchandise Authorization ID.
        retailer_uuid:
          type: string
          format: uuid
          description: Optional. Child retailer UUID. The child retailer must be linked to the retailer
            that owns the API key.
      required:
      - donor
      - location
      - items
