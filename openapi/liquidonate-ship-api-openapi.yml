            weight:
              type: number
              format: double
              description: Total parcel weight in pounds.
              example: 2.7
        items:
          type: array
          items:
            $ref: '#/components/schemas/RequestItem'
        match_uuid:
          type: string
          format: uuid
          description: Optional. UUID returned by v1/matchAndShip/estimate. Recommended so the same match and rate are applied.
        order_id:
          type: string
          description: Optional. Your identifier for the associated order.
        rma_id:
          type: string
          description: Optional. Return Merchandise Authorization ID.
        retailer_uuid:
          type: string
          format: uuid
          description: Optional. Child retailer UUID. The child retailer must be linked to the retailer that owns the API key.
      required:
      - donor
      - location
      - items
    RequestItem:
      type: object
      description: An item being donated or returned.
      properties:
        title:
          type: string
          example: Original Bag - Ivory
        sku:
          type: string
          example: ABV001
        description:
          type: string
        quantity:
          type: integer
          example: 1
        price:
          type: string
          example: '100.00'
        categoryTypes:
          type: array
          description: One or more LiquiDonate item categories. Drives nonprofit matching.
          items:
            $ref: '#/components/schemas/CategoryType'
        conditionTagTypes:
          type: array
          items:
            type: string
            example: new
          description: Condition tags for the item, e.g. "new".
        weightLbs:
          type: number
          format: double
          example: 2.5
      required:
      - title
      - quantity
    MatchResponse:
      type: object
      properties:
        match:
          $ref: '#/components/schemas/Match'
    Address:
      type: object
      description: A US postal address. Latitude/longitude are optional; LiquiDonate geocodes when omitted.
      properties:
        streetAddress1:
          type: string
          example: 149 New Montgomery St.
        streetAddress2:
          type: string
          nullable: true
          example: Floor 4
        city:
          type: string
          example: San Francisco
        state:
          type: string
          description: Two-letter state code.
          example: CA
        zip:
          type: string
          example: '94105'
        countryCode:
          type: string
          example: US
        latitude:
          type: number
          format: double
          nullable: true
          example: 38.77497
        longitude:
          type: number
          format: double
          nullable: true
          example: -122.431297
      required:
